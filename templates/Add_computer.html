<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Computer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='Add_computer.css') }}">
</head>

<body>

<div class="main">

    <div class="asset-form">

        <div class="form-header">
            <h1>Add Computer</h1>
            <p>Enter computer asset information</p>
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="success">
                {{ success }}
            </div>
        {% endif %}


        <form method="POST"
              action="{{ url_for('add_computer') }}">


            <!-- =========================================
                 ASSET INFORMATION
            ========================================== -->

            <h2>Asset Information</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Brand</label>

                    <input type="text"
                           name="brand"
                           placeholder="Enter brand">

                </div>


                <div class="form-group">

                    <label>Model</label>

                    <input type="text"
                           name="model"
                           placeholder="Enter model">

                </div>


                <div class="form-group">

                    <label>Serial Number</label>

                    <input type="text"
                           name="serial_number"
                           placeholder="Enter serial number">

                </div>

            </div>


            <!-- =========================================
                 ASSIGNMENT
            ========================================== -->

            <h2>Assignment</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Assigned To</label>

                    <select name="assigned_to">

                        <option value="">
                            Not Assigned
                        </option>

                        {% for user in users %}

                            <option value="{{ user[0] }}">
                                {{ user[1] }} - {{ user[0] }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label>Location</label>

                    <input type="text"
                           name="location"
                           placeholder="Enter location">

                </div>


                <div class="form-group">

                    <label>Seating Number</label>

                    <input type="text"
                           name="seating_no"
                           placeholder="Enter seating number">

                </div>

            </div>


            <!-- =========================================
                 HARDWARE
            ========================================== -->

            <h2>Hardware</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Processor</label>

                    <input type="text"
                           name="processor"
                           placeholder="Example: Intel Core i5">

                </div>


                <div class="form-group">

                    <label>CPU Cores</label>

                    <input type="number"
                           name="cpu_cores"
                           placeholder="Example: 8">

                </div>


                <div class="form-group">

                    <label>RAM</label>

                    <input type="text"
                           name="ram"
                           placeholder="Example: 16 GB">

                </div>


                <div class="form-group">

                    <label>Storage</label>

                    <input type="text"
                           name="storage"
                           placeholder="Example: 512 GB">

                </div>


                <div class="form-group">

                    <label>Storage Type</label>

                    <select name="storage_type">

                        <option value="">Select</option>

                        <option value="SSD">
                            SSD
                        </option>

                        <option value="HDD">
                            HDD
                        </option>

                        <option value="NVMe">
                            NVMe
                        </option>

                    </select>

                </div>

            </div>


            <!-- =========================================
                 OPERATING SYSTEM
            ========================================== -->

            <h2>Operating System</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Operating System</label>

                    <input type="text"
                           name="operating_system"
                           placeholder="Example: Windows">

                </div>


                <div class="form-group">

                    <label>OS Version</label>

                    <input type="text"
                           name="os_version"
                           placeholder="Example: Windows 11 Pro">

                </div>

            </div>


            <!-- =========================================
                 NETWORK
            ========================================== -->

            <h2>Network</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Hostname</label>

                    <input type="text"
                           name="hostname"
                           placeholder="Enter hostname">

                </div>


                <div class="form-group">

                    <label>IP Address</label>

                    <input type="text"
                           name="ip_address"
                           placeholder="Example: 192.168.1.10">

                </div>


                <div class="form-group">

                    <label>MAC Address</label>

                    <input type="text"
                           name="mac_address"
                           placeholder="Example: AA:BB:CC:DD:EE:FF">

                </div>

            </div>


            <!-- =========================================
                 ASSET MANAGEMENT
            ========================================== -->

            <h2>Asset Management</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Condition</label>

                    <select name="condition">

                        <option value="Good">
                            Good
                        </option>

                        <option value="Damaged">
                            Damaged
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select name="status">

                        <option value="Available">
                            Available
                        </option>

                        <option value="Assigned">
                            Assigned
                        </option>

                        <option value="Under Maintenance">
                            Under Maintenance
                        </option>

                        <option value="Retired">
                            Retired
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Warranty</label>

                    <input type="text"
                           name="warranty"
                           placeholder="Example: 3 Years">

                </div>


                <div class="form-group">

                    <label>License</label>

                    <input type="text"
                           name="license"
                           placeholder="License information">

                </div>


                <div class="form-group">

                    <label>Remarks</label>

                    <textarea name="remarks"
                              placeholder="Additional information"></textarea>

                </div>

            </div>


            <button type="submit">
                Add Computer
            </button>

        </form>

    </div>

</div>

</body>

</html>
