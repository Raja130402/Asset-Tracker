
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Details</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='user_details.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =====================================================
     NAVIGATION BAR
====================================================== -->

<div class="nav-bar">

    <nav>

        <a href="{{ url_for('user_table') }}">

            <button class="back" type="button">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </button>

        </a>


        <h1>Asset Tracker</h1>


    </nav>

</div>



<!-- =====================================================
     MAIN
====================================================== -->

<div class="main">


    <div class="user-form">


        <!-- =================================================
             FORM HEADER
        ================================================== -->

        <h2>

            <i class="fa-solid fa-user"></i>

            {% if user %}
                Update User
            {% else %}
                Add User
            {% endif %}

        </h2>


        <p>
            Manage employee and asset assignment details
        </p>



        <!-- =================================================
             ERROR MESSAGE
        ================================================== -->

        {% if error %}

            <div class="error">

                <i class="fa-solid fa-circle-exclamation"></i>

                {{ error }}

            </div>

        {% endif %}



        <!-- =================================================
             SUCCESS MESSAGE
        ================================================== -->

        {% if success %}

            <div class="success">

                <i class="fa-solid fa-circle-check"></i>

                {{ success }}

            </div>

        {% endif %}



        <!-- =================================================
             FORM
        ================================================== -->

        <form
            method="POST"

            {% if user %}

                action="{{ url_for('update_user', id=user[0]) }}"

            {% else %}

                action="{{ url_for('Add_user') }}"

            {% endif %}
        >


            <div class="form-grid">


                <!-- EMPLOYEE CODE -->

                <div class="form-group">

                    <label>

                        Employee Code

                    </label>

                    <input
                        type="text"
                        name="Employee_code"

                        value="{{ user[1] if user else '' }}"

                        placeholder="Employee code"
                    >

                </div>



                <!-- EMPLOYEE NAME -->

                <div class="form-group">

                    <label>

                        Employee Name

                    </label>

                    <input
                        type="text"
                        name="Employee_name"

                        value="{{ user[2] if user else '' }}"

                        placeholder="Employee name"
                    >

                </div>



                <!-- TL NAME -->

                <div class="form-group">

                    <label>

                        TL Name

                    </label>

                    <input
                        type="text"
                        name="TL_name"

                        value="{{ user[3] if user else '' }}"

                        placeholder="TL name"
                    >

                </div>



                <!-- TEAM NAME -->

                <div class="form-group">

                    <label>

                        Team Name

                    </label>

                    <input
                        type="text"
                        name="Team_name"

                        value="{{ user[4] if user else '' }}"

                        placeholder="Team name"
                    >

                </div>



                <!-- ASSIGNED ASSET -->

                <div class="form-group">

                    <label>

                        Assigned Asset

                    </label>

                    <input
                        type="text"
                        name="Assigned_asset"

                        value="{{ user[5] if user else '' }}"

                        placeholder="Assigned asset"
                    >

                </div>



                <!-- LOCATION -->

                <div class="form-group">

                    <label>

                        Location

                    </label>

                    <select name="Location">


                        <option
                            value="Main office"

                            {% if user and user[6] == 'Main office' %}

                                selected

                            {% endif %}
                        >

                            Main office

                        </option>


                        <option
                            value="Amnet"

                            {% if user and user[6] == 'Amnet' %}

                                selected

                            {% endif %}
                        >

                            Amnet

                        </option>


                        <option
                            value="New office"

                            {% if user and user[6] == 'New office' %}

                                selected

                            {% endif %}
                        >

                            New office

                        </option>


                    </select>

                </div>


            </div>



            <!-- =================================================
                 SUBMIT
            ================================================== -->

            <button
                class="submit"
                type="submit"
            >

                <i class="fa-solid fa-floppy-disk"></i>

                {% if user %}

                    Update

                {% else %}

                    Add User

                {% endif %}

            </button>


        </form>


    </div>


</div>


</body>

</html>
